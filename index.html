<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фотограф мечты</title>
  <link rel="icon" href="data/media/logo.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>
<body>
  <header id="header"></header>

  <main>
    <!-- Герой: текст придёт из main.json -->
    <section id="hero">
      <h1 id="heroTitle"></h1>
      <p  id="heroSubtitle"></p>
    </section>

    <!-- Слайдер примеров работ -->
    <section>
      <h2>Примеры работ</h2>
      <div class="swiper-outer">
        <button class="swiper-btn" id="prevBtn">&#8592;</button>
        <div class="swiper">
          <div class="swiper-wrapper" id="swiperWrapper"></div>
        </div>
        <button class="swiper-btn" id="nextBtn">&#8594;</button>
      </div>
    </section>

    <!-- Преподаватели -->
    <section>
      <h2>Преподаватели</h2>
      <div id="teachers"></div>
    </section>

    <!-- Обратная связь -->
    <section>
      <h2>Обратная связь</h2>
      <form id="feedbackForm">
        <label>Имя<br><input type="text" name="name"></label><br>
        <label>Email<br><input type="email" name="email"></label><br>
        <label>Сообщение<br><textarea name="message" rows="4"></textarea></label><br>
        <button type="submit">Отправить</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
