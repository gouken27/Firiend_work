<!DOCTYPE html>
<html lang="ru">
<head>
  <script>if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фотограф мечты</title>
  <link rel="icon" href="media/header/logo.png" type="image/png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>
<body>
  <header>
    <button class="btn btn-icon burger" id="burgerBtn">☰</button>
    <a class="logo-link" href="index.html">
      <img src="media/header/logo.png" alt="Логотип" height="45">
      <img src="media/header/text_logo.webp" alt="Академия света" height="45">
    </a>
    <nav>
      <a href="index.html">Главная</a>
      <a href="pages/dashboard.html">Дашборд</a>
      <a href="pages/courses.html">Курсы</a>
      <a href="pages/profile.html">Профиль</a>
    </nav>
    <button class="btn btn-icon" id="themeBtn" title="Сменить тему">☀️</button>
    <a class="profile-link" href="pages/profile.html">
      <img id="avatar" src="media/header/un_profile.jpeg" alt="Аватар" width="32" height="32">
      <span class="username">Megu_UwU</span>
    </a>
    <dialog class="mobile-menu" id="mobileMenu">
      <nav>
        <a href="index.html">Главная</a>
        <a href="pages/dashboard.html">Дашборд</a>
        <a href="pages/courses.html">Курсы</a>
        <a href="pages/profile.html">Профиль</a>
      </nav>
      <button class="btn btn-secondary" id="closeMenu">Закрыть</button>
    </dialog>
  </header>

  <main>
    <section id="hero">
      <h1>Фотограф мечты</h1>
      <p>Хочешь крутые и стильные фото? Или мечтаешь научиться фотошопу?</p>
    </section>

    <section>
      <h2>Примеры работ</h2>
      <div class="swiper-outer">
        <button class="btn btn-icon swiper-btn" id="prevBtn">&#8592;</button>
        <div class="swiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="media/course_present/Fashion.jpg" alt="Портрет"><p>Портрет</p></div>
            <div class="swiper-slide"><img src="media/course_present/peizazh.jpg" alt="Пейзаж"><p>Пейзаж</p></div>
            <div class="swiper-slide"><img src="media/course_present/portret.jpg" alt="Стрит"><p>Стрит</p></div>
            <div class="swiper-slide"><img src="media/course_present/reportazh.jpg" alt="Fashion"><p>Fashion</p></div>
            <div class="swiper-slide"><img src="media/course_present/stret.jpg" alt="Репортаж"><p>Репортаж</p></div>
          </div>
        </div>
        <button class="btn btn-icon swiper-btn" id="nextBtn">&#8594;</button>
      </div>
    </section>

    <section>
      <h2>Преподаватели</h2>
      <div class="teachers">
        <div><img src="media/teachers/teacher_1.jpg" alt="Алексей" width="80" height="80"><p>Алексей</p></div>
        <div><img src="media/teachers/teacher_2.jpg" alt="Мария" width="80" height="80"><p>Мария</p></div>
        <div><img src="media/teachers/teacher_3.jpg" alt="Дима" width="80" height="80"><p>Дима</p></div>
      </div>
    </section>

    <section id="feedback">
      <h2>Обратная связь</h2>
      <form id="feedbackForm">
        <label>Имя<input type="text" name="name"></label>
        <label>Email<input type="email" name="email"></label>
        <label>Сообщение<textarea name="message" rows="4"></textarea></label>
        <button type="submit" class="btn btn-primary">Отправить</button>
      </form>
    </section>
  </main>

  <footer>
    <span>Сделано студентом <a href="pages/profile.html">Megu_UwU</a></span>
    <div class="footer-user">
      <img src="media/header/un_profile.jpeg" alt="Аватар" width="28" height="28">
      <span>Megu_UwU</span>
      <a href="mailto:Megu_UwU@gmail.com">✉</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
