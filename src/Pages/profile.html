<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль</title>
  <link rel="stylesheet" href="../css/index.css">
</head>
<body>
  <!-- Хедер (отрисовывается JS) -->
  <header id="header"></header>

  <!-- Основное содержимое -->
  <main>
    <!-- Карточка профиля -->
    <div class="profile-card">
      <!-- Заголовок с аватаром и информацией -->
      <div class="profile-card__header">
        <img src="" alt="avatar" class="profile-card__avatar">
        <div class="profile-card__info">
          <h2 class="profile-card__name"></h2>
          <p>Фотограф и преподаватель</p>
        </div>
      </div>
      
      <!-- Кнопки действий -->
      <div class="profile-card__buttons">
        <button id="editBtn" class="profile-card__btn profile-card__btn--primary">Редактировать</button>
        <button id="logoutBtn" class="profile-card__btn profile-card__btn--secondary">Выход</button>
      </div>
    </div>

    <!-- Форма регистрации -->
    <div class="registration-form">
      <h3>Присоединиться</h3>
      <form id="registrationForm">
        <!-- Поле имени -->
        <div class="form-group">
          <label for="reg-name">Имя</label>
          <input type="text" id="reg-name" name="name" placeholder="Введите имя" required>
        </div>
        
        <!-- Поле email -->
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="email" placeholder="Введите email" required>
        </div>
        
        <!-- Кнопка отправки -->
        <div class="form-group">
          <button type="submit">Зарегистрироваться</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Модальное окно редактирования профиля -->
  <dialog id="editModal">
    <h3>Редактировать профиль</h3>
    <form id="editForm">
      <!-- Поле имени в форме редактирования -->
      <div class="form-group">
        <label for="edit-name">Имя</label>
        <input type="text" id="edit-name" name="name">
      </div>
      
      <!-- Кнопки сохранения и отмены -->
      <div class="form-group">
        <button type="submit">Сохранить</button>
        <button type="button" id="cancelEdit">Отмена</button>
      </div>
    </form>
  </dialog>

  <!-- Скрипт инициализации -->
  <script type="module">
    // Импортируем функции для хедера и профиля
    import { renderHeader } from '../js/header.js';
    import { renderProfile } from '../js/users.js';
    
    // Отрисовываем хедер
    renderHeader();
    
    // Отрисовываем профиль
    renderProfile();
  </script>
</body>
</html>
