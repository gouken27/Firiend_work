<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курсы</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <!-- Хедер (отрисовывается JS) -->
    <header id="header"></header>

    <!-- Основное содержимое -->
    <main>
        <!-- Заголовок страницы -->
        <div class="courses-header">
            <h1>Все курсы</h1>
            <p>Выберите курс для обучения</p>
        </div>

        <!-- Сетка с курсами (заполняется JS) -->
        <div id="courses-grid"></div>
    </main>

    <!-- Скрипт для инициализации страницы -->
    <script type="module">
        // Импортируем функции для хедера и курсов
        import { renderHeader } from '../js/header.js';
        import { renderCourses } from '../js/course.js';
        
        // Отрисовываем хедер
        renderHeader();
        
        // Отрисовываем курсы в контейнер
        renderCourses();
    </script>
</body>
</html>
